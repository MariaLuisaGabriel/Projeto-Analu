<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma SES-DF 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medical: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Teal 500
                            600: '#0d9488', // Teal 600
                            700: '#0f766e', // Teal 700
                        },
                        shift: {
                            bg: '#ffedd5',
                            text: '#ea580c',
                            border: '#fdba74'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .checkbox-custom {
            appearance: none;
            width: 1.15em;
            height: 1.15em;
            border: 2px solid #cbd5e1;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .checkbox-custom::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: transform;
            transform-origin: bottom left;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .checkbox-custom:checked {
            background-color: #0d9488;
            border-color: #0d9488;
        }
        .checkbox-custom:checked::before {
            transform: scale(1);
        }
        
        .checkbox-custom:checked + .item-input {
            color: #94a3b8;
            text-decoration: line-through;
        }
        textarea.item-input {
            resize: none;
            overflow: hidden;
            line-height: 1.35;
            min-height: 1.75rem;
            border-style: solid;
            border-top-width: 0;
            border-right-width: 0;
            border-left-width: 0;
            border-bottom-width: 1px;
        }

        .day-btn {
            transition: all 0.2s;
        }
        .day-btn.active {
            background-color: #ffedd5;
            color: #ea580c;
            border-color: #fdba74;
            font-weight: 600;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header & Dashboard -->
    <header class="bg-medical-700 shadow-md sticky top-0 z-20">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4 text-white">
                    <div class="bg-white/20 p-3 rounded-xl backdrop-blur-sm">
                        <i class="fas fa-heartbeat text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Cronograma SES-DF 2027</h1>
                        <p class="text-medical-100 text-sm font-medium">Rotina Grupo 12 - Conciliando Plantões HRC e Estudos</p>
                    </div>
                </div>
                
                <!-- Global Progress Bar -->
                <div class="bg-white/10 border border-white/20 rounded-xl p-4 w-full md:w-96 backdrop-blur-sm shadow-inner">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-medium text-white flex items-center gap-2">
                            <i class="fas fa-tasks"></i> Progresso das Revisões
                        </span>
                        <span id="progress-text" class="text-sm font-bold text-white">0 / 0</span>
                    </div>
                    <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden">
                        <div id="progress-bar" class="bg-medical-100 h-2.5 rounded-full transition-all duration-500 ease-out relative" style="width: 0%">
                            <div class="absolute inset-0 bg-white/20 w-full animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Salvamento no arquivo local -->
            <div id="file-panel" class="mt-4 flex items-center gap-3 text-sm">
                <span id="file-dot" class="w-2.5 h-2.5 rounded-full bg-slate-300 shrink-0"></span>
                <span id="file-status">Carregando…</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="weeks-container">
            <!-- Weeks generated by JS -->
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        const topics = [
            "Abordagem Inicial", "Trauma de Face", "Trauma Torácico", "Trauma Abdominal", "TCE", 
            "Queimaduras", "Abdome Agudo Inflamatório", "Abdome Agudo Isquêmico", "Abdome Agudo Obstrutivo", 
            "Abdome Agudo Perfurativo", "Cirurgia da Obesidade", "Cólon e Reto", "Hemorragia Digestiva", 
            "Tumores Aparelho Digestivo", "Técnica Operatória", "Cuidados Pré-operatórios", "Cuidados Pós-Operatórios", 
            "Feridas e Enxertos", "Hérnias", "Anestesia", "Afecções Pancreáticas", "Doença Inflamatória Intestinal", 
            "Síndrome Disfágica", "Síndrome Dispéptica", "Vias Biliares", "Tumores Dermatológicos", 
            "Tumores Cabeça e Pescoço", "Aneurismas", "Doença Arterial Periférica", "Doenças Venosas", 
            "Estenose de Carótidas", "Afecções Urológicas Benignas", "Tumores Urológicos", "Cirurgia Torácica", 
            "Tumores Pulmonares", "Fraturas Ósseas", "Luxações", "Ortopedia Pediátrica", "Tendinites", "HAS", 
            "Insuficiência Cardíaca", "Valvopatias", "Síndrome Coronariana", "Diabetes", "Síndrome Metabólica", 
            "Tireoide", "Paratireoides e Suprarrenal", "Distúrbios Hidroeletrolíticos", "Glomerulopatias e Tubulopatias", 
            "Insuficiência Renal", "Distúrbios Obstrutivos", "Embolia Pulmonar", "Pneumonias e Síndromes Gripais", 
            "Tuberculose", "Síndromes Febris", "Endocardite", "Infecções do SNC", "HIV e AIDS", "Hepatites", 
            "Cirrose e Insuficiência Hepática", "Artrites", "Colagenoses e Miopatias", "Vasculites", "Anemias", 
            "Onco-Hematologia", "Distúrbios da Hemostasia", "Geriatria e Demências", "AVC", "Síndromes Neurológicas", 
            "Cefaleias", "Doenças Pulmonares Intersticiais", "Abuso de Substâncias", "Sepse e Choque", 
            "Doenças Infectoparasitárias", "Farmacodermias", "Transtornos Mentais", "Intoxicações Exógenas", 
            "Aspectos Históricos do SUS", "Atenção Primária à Saúde", "Níveis de Prevenção", "Ética médica", 
            "Notificação", "Epidemias e Pandemias", "Estatística de Testes", "Indicadores de Morbimortalidade", 
            "Crescimento e Desenvolvimento", "Imunizações", "Transtornos do Comportamento", "Distúrbios Estaturais", 
            "Distúrbios Carenciais", "Constipação Intestinal", "Síndromes Diarreicas", "Parasitoses", 
            "Nariz, Ouvido e Laringe", "Pneumonias (Pediatria)", "Doenças Exantemáticas", "Síndromes Febris (Pediatria)", 
            "Diabetes (Pediatria)", "ITU (Pediatria)"
        ];

        const daysOfWeek = [
            { label: 'S', name: 'Segunda' }, { label: 'T', name: 'Terça' }, { label: 'Q', name: 'Quarta' },
            { label: 'Q', name: 'Quinta' }, { label: 'S', name: 'Sexta' }, { label: 'S', name: 'Sábado' },
            { label: 'D', name: 'Domingo' }
        ];

        // O arquivo guarda as semanas. Esta lista só entra na primeira vez,
        // quando dados/cronograma.json ainda não tem "weeks".
        const LIMIT_WEEKS = 80;
        const LIMIT_ITEMS = 24;
        const LIMIT_TEXT = 2000;

        let state = { weeks: [], startDate: null };
        let focusAfterRender = null;

        const STORAGE_KEY = 'cronograma_sesdf_state_v2';

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function clampText(value) {
            return String(value == null ? '' : value).replace(/[\r\n]+/g, ' ').slice(0, LIMIT_TEXT);
        }

        function blankItem() {
            return { text: '', done: false };
        }

        function blankShifts() {
            return [false, false, false, false, false, false, false];
        }

        function emptyWeek() {
            return {
                revisions: [blankItem(), blankItem(), blankItem(), blankItem()],
                classes: [blankItem(), blankItem(), blankItem(), blankItem()],
                shifts: blankShifts()
            };
        }

        function buildDefaultWeeks() {
            const weeks = [];
            for (let i = 0; i < topics.length; i += 4) {
                weeks.push({
                    revisions: topics.slice(i, i + 4).map((text) => ({ text: text, done: false })),
                    classes: [blankItem(), blankItem(), blankItem(), blankItem()],
                    shifts: blankShifts()
                });
            }
            return weeks;
        }

        function normalizeItem(item) {
            const source = isPlainObject(item) ? item : {};
            return {
                text: clampText(typeof source.text === 'string' ? source.text : ''),
                done: source.done === true
            };
        }

        // Aula registrada = item com texto, sempre marcado como assistido,
        // com data opcional ("YYYY-MM-DD"). Itens sem texto são descartados.
        function normalizeClass(item) {
            const base = normalizeItem(item);
            if (!base.text.trim()) return null;
            const out = { text: base.text, done: true };
            if (isPlainObject(item) && isValidIsoDate(item.date)) out.date = item.date;
            return out;
        }

        function normalizeWeek(week) {
            const source = isPlainObject(week) ? week : {};
            const revisions = Array.isArray(source.revisions) ? source.revisions.slice(0, LIMIT_ITEMS).map(normalizeItem) : [];
            const classes = Array.isArray(source.classes) ? source.classes.map(normalizeClass).filter(Boolean).slice(0, LIMIT_ITEMS) : [];
            const incoming = Array.isArray(source.shifts) ? source.shifts : [];
            return {
                revisions: revisions,
                classes: classes,
                shifts: [0, 1, 2, 3, 4, 5, 6].map((i) => incoming[i] === true)
            };
        }

        function readLegacyMaps(source) {
            const base = isPlainObject(source) ? source : {};
            return {
                revisions: isPlainObject(base.revisions) ? base.revisions : {},
                classesText: isPlainObject(base.classesText) ? base.classesText : {},
                classesDone: isPlainObject(base.classesDone) ? base.classesDone : {},
                shifts: isPlainObject(base.shifts) ? base.shifts : {}
            };
        }

        function applyLegacyProgress(weeks, legacy) {
            weeks.forEach((week, weekIdx) => {
                week.revisions.forEach((item, topicIdx) => {
                    if (legacy.revisions[weekIdx + '-' + topicIdx] === true) item.done = true;
                });
                week.classes.forEach((item, classIdx) => {
                    const key = weekIdx + '-' + classIdx;
                    if (typeof legacy.classesText[key] === 'string') item.text = clampText(legacy.classesText[key]);
                    if (legacy.classesDone[key] === true) item.done = true;
                });
                week.shifts = blankShifts().map((_, dayIdx) => legacy.shifts[weekIdx + '-' + dayIdx] === true);
            });
        }

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function toIsoDate(date) {
            return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
        }

        function parseIsoDate(value) {
            const parts = value.split('-').map(Number);
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function isValidIsoDate(value) {
            if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            return toIsoDate(parseIsoDate(value)) === value;
        }

        function normalizeState(loaded) {
            const startDate = isPlainObject(loaded) && isValidIsoDate(loaded.startDate) ? loaded.startDate : null;
            if (isPlainObject(loaded) && Array.isArray(loaded.weeks)) {
                return { weeks: loaded.weeks.slice(0, LIMIT_WEEKS).map(normalizeWeek), startDate };
            }
            const weeks = buildDefaultWeeks();
            applyLegacyProgress(weeks, readLegacyMaps(loaded));
            return { weeks: weeks.map(normalizeWeek), startDate };
        }

        const SERVER_ORIGIN = 'http://127.0.0.1:8765';
        let serverReady = false;
        let writeTimer = null;
        let writeChain = Promise.resolve();

        function apiUrl(path) {
            if (location.protocol === 'http:' || location.protocol === 'https:') return path;
            return SERVER_ORIGIN + path;
        }

        function isPlainObject(value) {
            return !!value && typeof value === 'object' && !Array.isArray(value);
        }

        function isLegacyBlank(raw) {
            if (!isPlainObject(raw) || Array.isArray(raw.weeks)) return false;
            return ['revisions', 'classesText', 'classesDone', 'shifts'].every((name) => {
                const map = raw[name];
                return !isPlainObject(map) || Object.keys(map).length === 0;
            });
        }

        function legacyHasProgress(raw) {
            if (!isPlainObject(raw) || Array.isArray(raw.weeks)) return false;
            return ['revisions', 'classesText', 'classesDone', 'shifts'].some((name) => {
                const map = raw[name];
                return isPlainObject(map) && Object.keys(map).some((key) => map[key]);
            });
        }

        function snapshot() {
            const snap = { weeks: state.weeks };
            if (state.startDate) snap.startDate = state.startDate;
            return snap;
        }

        function readLocalRaw() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return null;
            try {
                const parsed = JSON.parse(saved);
                if (!isPlainObject(parsed)) return null;
                if (!Array.isArray(parsed.weeks) && !('revisions' in parsed)) return null;
                return parsed;
            } catch (e) {
                console.error('Erro ao ler a cópia do navegador', e);
                return null;
            }
        }

        function persistLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot()));
        }

        function saveState() {
            persistLocal();
            updateProgressBar();
            scheduleServerWrite();
        }

        function fetchTimeout(url, options, ms) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            return fetch(url, Object.assign({}, options, { signal: controller.signal }))
                .finally(() => clearTimeout(timer));
        }

        function setFileStatus(text, color) {
            document.getElementById('file-status').innerText = text;
            const dot = document.getElementById('file-dot');
            dot.className = 'w-2.5 h-2.5 rounded-full shrink-0 ' + color;
        }

        async function writeServerNow() {
            if (!serverReady) return;
            const saveTime = Date.now();
            const res = await fetch(apiUrl('/api/estado'), {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Save-Time': String(saveTime)
                },
                body: JSON.stringify(snapshot(), null, 2)
            });
            if (res.status === 409) return;
            if (!res.ok) throw new Error('Não foi possível gravar o arquivo');
            const hora = new Date(saveTime).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            setFileStatus('Salvo às ' + hora, 'bg-green-400');
        }

        function scheduleServerWrite() {
            if (!serverReady) return;
            clearTimeout(writeTimer);
            setFileStatus('Salvando…', 'bg-yellow-300');
            writeTimer = setTimeout(() => {
                writeChain = writeChain.then(() => writeServerNow()).catch((err) => {
                    console.error('Erro ao salvar no arquivo', err);
                    setFileStatus('Não consegui gravar os dados. Seus dados continuam neste navegador.', 'bg-red-400');
                });
            }, 600);
        }

        function flushServerWrite() {
            if (!serverReady) return;
            clearTimeout(writeTimer);
            const saveTime = Date.now();
            fetch(apiUrl('/api/estado'), {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Save-Time': String(saveTime)
                },
                body: JSON.stringify(snapshot(), null, 2),
                keepalive: true
            }).catch(() => {});
        }

        window.addEventListener('pagehide', flushServerWrite);

        async function initPersistence() {
            const localRaw = readLocalRaw();
            try {
                const res = await fetchTimeout(apiUrl('/api/estado'), { cache: 'no-store' }, 2000);
                if (res.status === 500) {
                    serverReady = false;
                    state = localRaw ? normalizeState(localRaw) : normalizeState({});
                    setFileStatus('O arquivo não pôde ser lido. O progresso desta tela está só neste navegador.', 'bg-red-400');
                } else if (!res.ok) {
                    throw new Error('resposta ' + res.status);
                } else {
                    const remoteRaw = await res.json();
                    serverReady = true;
                    const remoteHasWeeks = isPlainObject(remoteRaw) && Array.isArray(remoteRaw.weeks);
                    const localHasWeeks = isPlainObject(localRaw) && Array.isArray(localRaw.weeks);
                    if (!remoteHasWeeks && isLegacyBlank(remoteRaw) && localRaw && (legacyHasProgress(localRaw) || localHasWeeks)) {
                        state = normalizeState(localRaw);
                        persistLocal();
                        try {
                            await writeServerNow();
                        } catch (err) {
                            console.error(err);
                            setFileStatus('Não consegui copiar o progresso para o arquivo. Ele continua neste navegador.', 'bg-red-400');
                        }
                    } else {
                        state = normalizeState(remoteRaw);
                        persistLocal();
                        if (!remoteHasWeeks) {
                            try {
                                await writeServerNow();
                            } catch (err) {
                                console.error(err);
                                setFileStatus('Não consegui gravar a estrutura no arquivo. Ela continua neste navegador.', 'bg-red-400');
                            }
                        } else {
                            setFileStatus('Conectado', 'bg-green-400');
                        }
                    }
                }
            } catch (e) {
                serverReady = false;
                state = localRaw ? normalizeState(localRaw) : normalizeState({});
                setFileStatus('Abra pelo Iniciar.bat para salvar em arquivo. Por enquanto, só neste navegador.', 'bg-orange-300');
            }
            renderWeeks();
            updateProgressBar();
        }

        function temasLabel(count) {
            return count === 1 ? '1 tema' : count + ' temas';
        }

        function shiftSummary(shifts) {
            const names = [];
            daysOfWeek.forEach((day, index) => {
                if (shifts[index]) names.push(day.name);
            });
            return names.length ? names.join(' · ') : 'Nenhum dia marcado';
        }

        function paintShiftSummary(el, shifts) {
            if (!el) return;
            const any = shifts.some(Boolean);
            el.textContent = shiftSummary(shifts);
            el.classList.toggle('text-orange-600', any);
            el.classList.toggle('font-medium', any);
            el.classList.toggle('text-slate-400', !any);
        }

        function fitField(el) {
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function blockEnter(event) {
            if (event.key === 'Enter') event.preventDefault();
        }

        function sectionHeader(icon, iconColor, title, addFn, weekIdx) {
            return `
                <div class="flex items-center justify-between gap-2 mb-1">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5 min-w-0">
                        <i class="fas ${icon} ${iconColor}"></i> ${title}
                    </h3>
                    <button type="button" onclick="${addFn}(${weekIdx})" class="border-0 bg-transparent cursor-pointer text-[11px] font-semibold text-medical-600 hover:text-medical-700 flex items-center gap-1 shrink-0">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>
            `;
        }

        function rowHtml(item, weekIdx, idx, kind) {
            const isRev = kind === 'rev';
            const placeholder = isRev ? 'Nova revisão...' : ('Aula ' + (idx + 1) + '...');
            const onToggle = isRev ? 'toggleRevision' : 'toggleClassDone';
            const onText = isRev ? 'updateRevisionText' : 'updateClassText';
            const onRemove = isRev ? 'removeRevision' : 'removeClass';
            const dataAttr = isRev ? 'data-rev' : 'data-class';
            const removeTitle = isRev ? 'Remover revisão' : 'Remover aula';
            const checkLabel = isRev ? 'Marcar revisão como feita' : 'Marcar aula como feita';
            const border = isRev ? 'border-transparent' : 'border-slate-200';
            const weight = isRev ? 'font-medium' : '';
            return `
                <div class="flex items-start gap-2 mt-2 min-w-0">
                    <input type="checkbox" ${item.done ? 'checked' : ''} onchange="${onToggle}(${weekIdx}, ${idx}, this.checked)" class="checkbox-custom shrink-0 mt-1" aria-label="${checkLabel}">
                    <textarea ${dataAttr}="${weekIdx}-${idx}" maxlength="${LIMIT_TEXT}" rows="1" autocomplete="off" placeholder="${placeholder}" oninput="${onText}(${weekIdx}, ${idx}, this.value); fitField(this)" onkeydown="blockEnter(event)" class="item-input flex-1 min-w-0 text-sm ${weight} bg-transparent border-0 border-b ${border} focus:border-medical-500 focus:outline-none py-1 px-1 text-slate-700 placeholder:text-slate-300">${escapeHtml(item.text)}</textarea>
                    <button type="button" title="${removeTitle}" aria-label="${removeTitle}" onclick="${onRemove}(${weekIdx}, ${idx})" class="border-0 bg-transparent cursor-pointer w-7 h-7 rounded-lg text-slate-300 hover:text-red-500 hover:bg-red-50 flex items-center justify-center shrink-0 mt-0.5">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
            `;
        }

        function listHtml(items, weekIdx, kind) {
            if (!items.length) {
                const label = kind === 'rev' ? 'Nenhuma revisão nesta semana.' : 'Nenhuma aula nesta semana.';
                return `<p class="text-xs text-slate-400 mt-2">${label}</p>`;
            }
            return items.map((item, idx) => rowHtml(item, weekIdx, idx, kind)).join('');
        }

        function shiftsHtml(week, weekIdx) {
            return daysOfWeek.map((day, dayIdx) => {
                const active = week.shifts[dayIdx];
                const verb = active ? 'Desmarcar' : 'Marcar';
                return `
                    <button type="button" onclick="toggleShift(this, ${weekIdx}, ${dayIdx})" aria-pressed="${active ? 'true' : 'false'}" title="${verb} ${day.name}" class="day-btn ${active ? 'active' : ''} w-7 h-7 rounded-full border border-slate-200 text-xs text-slate-400 bg-white flex items-center justify-center hover:border-orange-300 hover:text-orange-500 focus:outline-none">
                        ${day.label}
                    </button>
                `;
            }).join('');
        }

        function renderWeekCard(week, weekIdx) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition-shadow min-w-0';
            card.setAttribute('data-week-card', String(weekIdx));
            const summaryClass = week.shifts.some(Boolean) ? 'text-orange-600 font-medium' : 'text-slate-400';
            card.innerHTML = `
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-100 flex justify-between items-center gap-2">
                    <h2 class="font-bold text-slate-800 text-lg">Semana ${weekIdx + 1}</h2>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold text-medical-600 bg-medical-50 px-2 py-1 rounded-md border border-medical-100">
                            ${temasLabel(week.revisions.length)}
                        </span>
                        <button type="button" onclick="removeWeek(${weekIdx})" title="Remover semana" aria-label="Remover semana ${weekIdx + 1}" class="border-0 bg-transparent cursor-pointer text-[11px] font-semibold text-slate-400 hover:text-red-500 flex items-center gap-1">
                            <i class="fas fa-trash-alt"></i> Remover
                        </button>
                    </div>
                </div>
                <div class="p-5 flex-1 flex flex-col gap-5">
                    <div>
                        ${sectionHeader('fa-sync-alt', 'text-medical-500', 'Revisões da Semana', 'addRevision', weekIdx)}
                        <div class="flex flex-col">${listHtml(week.revisions, weekIdx, 'rev')}</div>
                    </div>
                    <div>
                        ${sectionHeader('fa-book-open', 'text-blue-500', 'Aulas Novas', 'addClass', weekIdx)}
                        <div class="flex flex-col">${listHtml(week.classes, weekIdx, 'class')}</div>
                    </div>
                    <div class="mt-auto pt-4 border-t border-slate-100">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            <i class="fas fa-hospital text-orange-500"></i> Plantões / Dias Pesados
                        </h3>
                        <p class="text-[11px] text-slate-400 mb-2">Clique no dia para marcar ou desmarcar.</p>
                        <div class="flex justify-between mt-2 gap-1">
                            ${shiftsHtml(week, weekIdx)}
                        </div>
                        <p data-shift-summary="${weekIdx}" class="text-xs mt-2 leading-snug ${summaryClass}">${escapeHtml(shiftSummary(week.shifts))}</p>
                    </div>
                </div>
                <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 text-[11px] text-slate-400 text-center flex items-center justify-center gap-2">
                    <i class="fas fa-lightbulb text-yellow-400"></i>
                    <span>Dica: Passe o olho no Notion e zere os cloze deletions no Anki.</span>
                </div>
            `;
            return card;
        }

        function renderAddWeekCard() {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'bg-white/70 border-2 border-dashed border-slate-300 rounded-2xl min-h-[16rem] p-6 font-sans flex flex-col items-center justify-center gap-3 text-slate-500 hover:border-medical-500 hover:text-medical-700 hover:bg-white transition-colors';
            card.setAttribute('data-add-week', 'true');
            card.onclick = addWeek;
            card.innerHTML = `
                <span class="w-12 h-12 rounded-full bg-medical-50 text-medical-600 flex items-center justify-center">
                    <i class="fas fa-plus text-lg"></i>
                </span>
                <span class="font-semibold">Adicionar semana</span>
            `;
            return card;
        }

        function restoreFocusOrScroll(scrollY) {
            if (!focusAfterRender) {
                window.scrollTo(0, scrollY);
                return;
            }
            const target = focusAfterRender;
            focusAfterRender = null;
            const attr = target.kind === 'rev' ? 'data-rev' : 'data-class';
            const el = document.querySelector('[' + attr + '="' + target.week + '-' + target.index + '"]');
            if (!el) return;
            el.focus();
            const card = el.closest('[data-week-card]');
            if (card) card.scrollIntoView({ block: 'nearest' });
        }

        function renderWeeks() {
            const container = document.getElementById('weeks-container');
            const scrollY = window.scrollY;
            container.innerHTML = '';
            state.weeks.forEach((week, weekIdx) => {
                const card = renderWeekCard(week, weekIdx);
                container.appendChild(card);
                card.querySelectorAll('textarea').forEach(fitField);
            });
            container.appendChild(renderAddWeekCard());
            restoreFocusOrScroll(scrollY);
            updateProgressBar();
        }

        function addRevision(weekIdx) {
            const week = state.weeks[weekIdx];
            if (!week) return;
            if (week.revisions.length >= LIMIT_ITEMS) {
                alert('Esta semana já tem o máximo de ' + LIMIT_ITEMS + ' revisões.');
                return;
            }
            week.revisions.push(blankItem());
            focusAfterRender = { week: weekIdx, kind: 'rev', index: week.revisions.length - 1 };
            renderWeeks();
            saveState();
        }

        function addClass(weekIdx) {
            const week = state.weeks[weekIdx];
            if (!week) return;
            if (week.classes.length >= LIMIT_ITEMS) {
                alert('Esta semana já tem o máximo de ' + LIMIT_ITEMS + ' aulas.');
                return;
            }
            week.classes.push(blankItem());
            focusAfterRender = { week: weekIdx, kind: 'class', index: week.classes.length - 1 };
            renderWeeks();
            saveState();
        }

        function itemHasContent(item) {
            return !!(item && (String(item.text || '').trim() || item.done));
        }

        function removeRevision(weekIdx, revIdx) {
            const week = state.weeks[weekIdx];
            if (!week || !week.revisions[revIdx]) return;
            if (itemHasContent(week.revisions[revIdx]) && !window.confirm('Remover esta revisão?')) return;
            week.revisions.splice(revIdx, 1);
            renderWeeks();
            saveState();
        }

        function removeClass(weekIdx, classIdx) {
            const week = state.weeks[weekIdx];
            if (!week || !week.classes[classIdx]) return;
            if (itemHasContent(week.classes[classIdx]) && !window.confirm('Remover esta aula?')) return;
            week.classes.splice(classIdx, 1);
            renderWeeks();
            saveState();
        }

        function removeWeek(weekIdx) {
            if (!state.weeks[weekIdx]) return;
            const message = 'Remover a semana ' + (weekIdx + 1) + '? O conteúdo dela será apagado e as semanas seguintes serão renumeradas.';
            if (!window.confirm(message)) return;
            state.weeks.splice(weekIdx, 1);
            renderWeeks();
            saveState();
        }

        function addWeek() {
            if (state.weeks.length >= LIMIT_WEEKS) {
                alert('O máximo é ' + LIMIT_WEEKS + ' semanas.');
                return;
            }
            state.weeks.push(emptyWeek());
            focusAfterRender = { week: state.weeks.length - 1, kind: 'rev', index: 0 };
            renderWeeks();
            saveState();
        }

        function updateRevisionText(weekIdx, revIdx, text) {
            const item = state.weeks[weekIdx] && state.weeks[weekIdx].revisions[revIdx];
            if (!item) return;
            item.text = clampText(text);
            saveState();
        }

        function updateClassText(weekIdx, classIdx, text) {
            const item = state.weeks[weekIdx] && state.weeks[weekIdx].classes[classIdx];
            if (!item) return;
            item.text = clampText(text);
            saveState();
        }

        function toggleRevision(weekIdx, revIdx, checked) {
            const item = state.weeks[weekIdx] && state.weeks[weekIdx].revisions[revIdx];
            if (!item) return;
            item.done = !!checked;
            saveState();
        }

        function toggleClassDone(weekIdx, classIdx, checked) {
            const item = state.weeks[weekIdx] && state.weeks[weekIdx].classes[classIdx];
            if (!item) return;
            item.done = !!checked;
            saveState();
        }

        function toggleShift(btn, weekIdx, dayIdx) {
            const week = state.weeks[weekIdx];
            if (!week || dayIdx < 0 || dayIdx > 6) return;
            week.shifts[dayIdx] = !week.shifts[dayIdx];
            const on = week.shifts[dayIdx];
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.title = (on ? 'Desmarcar ' : 'Marcar ') + daysOfWeek[dayIdx].name;
            paintShiftSummary(document.querySelector('[data-shift-summary="' + weekIdx + '"]'), week.shifts);
            saveState();
        }

        function updateProgressBar() {
            let total = 0;
            let completed = 0;
            state.weeks.forEach((week) => {
                week.revisions.forEach((item) => {
                    total += 1;
                    if (item.done) completed += 1;
                });
            });
            const percentage = total === 0 ? 0 : (completed / total) * 100;
            document.getElementById('progress-text').innerText = completed + ' / ' + total;
            const bar = document.getElementById('progress-bar');
            bar.style.width = percentage + '%';
            if (total > 0 && completed === total) {
                bar.classList.add('bg-green-400', 'shadow-[0_0_10px_#4ade80]');
                bar.classList.remove('bg-medical-100');
            } else {
                bar.classList.remove('bg-green-400', 'shadow-[0_0_10px_#4ade80]');
                bar.classList.add('bg-medical-100');
            }
        }

        navigator.storage?.persist?.();
        initPersistence();

    </script>
</body>
</html>
